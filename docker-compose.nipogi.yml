# NiPoGi agents-LXC deployment (Komodo-stack "emaildawg").
# Bygges lokalt fra Dockerfile.sliplane (run_build=true i stacken);
# app'en henter sin config via DOPPLER_TOKEN (renderes fra BWS).
services:
  emaildawg:
    image: emaildawg:local
    build:
      context: .
      dockerfile: Dockerfile.sliplane
    container_name: emaildawg
    restart: unless-stopped
    labels:
      org.opencontainers.image.source: "https://github.com/srosenlund/emaildawg"
      org.opencontainers.image.description: "emaildawg — Outlook/Graph-mail-bro til Beeper/Matrix"
    ports:
      # Graph-webhook-endpoint. Bundet til host-IP (LAN-only), ikke 0.0.0.0 —
      # Caddy paa nipogi-infra reverse-proxyer det offentligt via
      # emaildawg.stefanrosenlund.dk, saa Microsoft Graph kan naa
      # validerings-/notifikations-URL'en. Samme moenster som beeperbox.
      - "192.168.1.98:29319:29319"
    volumes:
      - /opt/emaildawg/data:/home/nonroot/app/data
    env_file: /opt/emaildawg/.env
