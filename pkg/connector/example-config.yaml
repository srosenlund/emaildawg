# IMAP connection settings
imap:
    # Default timeout for IMAP connections (in seconds)
    default_timeout: 30
    # How far back to fetch emails at startup (in seconds, 180 = 3 minutes)
    startup_backfill_seconds: 180
    # Maximum number of emails to fetch during startup backfill
    startup_backfill_max: 25
    # Initial IDLE timeout in seconds before reconnection
    initial_idle_timeout_seconds: 3

# OAuth2 / XOAUTH2 (Microsoft 365 modern auth).
# When enabled, the bridge authenticates IMAP via an app-only access token from
# the Entra app below instead of a password, and forces the Office 365 IMAP
# endpoint (outlook.office365.com:993). The Entra app needs the
# IMAP.AccessAsApp application permission + an Exchange service principal with
# mailbox access. Leave enabled=false to use classic password/app-password auth.
oauth2:
    enabled: false
    tenant_id: ""
    client_id: ""
    client_secret: ""
    # Auto-login: when set, the bridge logs this mailbox in automatically at
    # startup via XOAUTH2 — no interactive bot login needed. owner_mxid is the
    # Beeper user that owns the bridge (the admin in bridge.permissions).
    auto_login_email: ""
    owner_mxid: ""
    auto_login_folders: ["INBOX"]

# Graph read-path toggle.
# When enabled, incoming mail is delivered via Microsoft Graph change
# notifications (webhooks) + delta backfill instead of IMAP IDLE polling.
# Requires oauth2.enabled=true and a public appservice.public_address so
# Graph can reach the validation/notification endpoint. Set to false (default)
# to use classic IMAP polling.
graph:
    enabled: false

# Logging configuration
logging:
    # Sanitize PII from logs (recommended for production)
    sanitized: true
    # Secret for generating consistent pseudonyms (leave empty for random)
    pseudonym_secret: ""

# Email processing options
email_processing:
    # Max size for media uploads in bytes (25 MiB default)
    max_upload_bytes: 26214400
    # Attempt gzip for oversized original HTML/text bodies before attaching
    gzip_large_bodies: true
    # Reader-mode HTML sanitisation (strip clutter, tracking pixels, hidden preheaders)
    reader_mode: true
    # Inline images at or below this pixel dimension are dropped as tracking pixels
    reader_mode_min_img_px: 32
    # Prune footers/boilerplate in bulk mails (List-Unsubscribe) — layer 2 of reader mode
    reader_mode_extract: true
